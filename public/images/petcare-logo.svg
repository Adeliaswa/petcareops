<svg class="petcare-logo" viewBox="0 0 209 119" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="petcare-logo-title">
  <title id="petcare-logo-title">Pet Care Ops</title>
  <style>
:root{--brown:#533E36;--pink:#FFC5BE;--white:#fff}
.petcare-logo{width:100%;height:auto;overflow:visible;fill:none}
.w{fill:var(--white);stroke:none}.p{fill:var(--pink)}.b{fill:var(--brown)}
.s{stroke:var(--brown);stroke-width:3}.s2{stroke:var(--brown);stroke-width:2}.s1{stroke:var(--brown);stroke-width:1}.ps{stroke:var(--pink);stroke-width:3}
.logo-text{font-family:Fredoka,system-ui,sans-serif;font-size:12.5px;fill:var(--pink);stroke:var(--brown);stroke-width:3.5;stroke-linejoin:round;paint-order:stroke fill}
.cat,.dog{transform-box:fill-box;transform-origin:center bottom;animation:bob 2.8s ease-in-out infinite}.dog{animation-delay:.4s}.banner{transform-box:fill-box;transform-origin:center}
.petcare-logo:hover .banner{animation:wiggle .6s ease-in-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.5deg)}75%{transform:rotate(1.5deg)}}
@media(prefers-reduced-motion:reduce){.cat,.dog,.petcare-logo:hover .banner{animation:none}}
</style>
